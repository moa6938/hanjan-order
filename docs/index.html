<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172238" />
    <meta name="description" content="2층 음료 주문과 1층 제조 접수를 연결하는 간단한 주문 화면" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=readable-orders-1" />
    <title>한 잔 주문</title>
    <script type="module" crossorigin src="./assets/index-D3FpgQFo.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./#order" aria-label="음료 주문 홈">
        <span class="brand-mark" aria-hidden="true">●</span>
        <span>한 잔 주문</span>
      </a>
      <span id="connection-status" class="live-pill"><span></span> 연결 중</span>
    </header>

    <main>
      <section id="order-view" class="view" hidden>
        <div class="intro">
          <p class="eyebrow">2층 청소년 공간</p>
          <h1>마실 음료를 골라주세요.</h1>
          <p>주문이 접수되면 아래에서 진행 상태를 확인할 수 있어요. 기기당 하루 한 번 주문할 수 있습니다.</p>
        </div>

        <form id="order-form" class="order-form">
          <div class="order-meta">
            <label class="note-field">
              <span>주문자 이름</span>
              <input id="customer-name" maxlength="20" placeholder="예: 홍길동" autocomplete="name" required />
            </label>
            <label class="note-field">
              <span>인원수</span>
              <input id="party-size" type="number" min="1" max="20" value="1" inputmode="numeric" required />
            </label>
          </div>
          <div id="menu-list" class="menu-sections" aria-live="polite"></div>
          <p id="quantity-error" class="error-message" role="status"></p>
          <label class="note-field">
            <span>요청사항 <small>선택</small></span>
            <input id="order-note" maxlength="80" placeholder="예: 얼음 조금만" autocomplete="off" />
          </label>
          <button class="primary-button" type="submit">주문 보내기</button>
          <p id="order-error" class="error-message" role="alert"></p>
        </form>

        <section id="ticket" class="ticket" hidden aria-live="polite">
          <p class="eyebrow">내 주문</p>
          <div class="ticket-heading">
            <strong id="ticket-id"></strong>
            <span id="ticket-status" class="status-badge"></span>
          </div>
          <p id="ticket-customer" class="ticket-customer"></p>
          <p id="ticket-items"></p>
          <p id="ticket-message" class="ticket-message"></p>
          <button id="new-order-button" class="secondary-button" type="button">새 주문하기</button>
        </section>
      </section>

      <section id="admin-view" class="view admin-view" hidden>
        <form id="admin-login" class="login-card">
          <p class="eyebrow">1층 음료 제조 공간</p>
          <h1>관리자 확인</h1>
          <p>주문을 확인하려면 관리자 비밀번호를 입력하세요.</p>
          <label class="note-field">
            <span>비밀번호</span>
            <input id="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="current-password" required autofocus />
          </label>
          <button class="primary-button" type="submit">관리 화면 열기</button>
          <p id="admin-login-error" class="error-message" role="alert"></p>
        </form>

        <div id="admin-dashboard" hidden>
          <div class="admin-heading">
            <div>
              <p class="eyebrow">1층 음료 제조 공간</p>
              <h1>들어온 주문</h1>
            </div>
            <button id="audio-button" class="audio-button" type="button">🔔 알림 켜기</button>
          </div>

          <aside class="setup-card">
            <div>
              <strong>2층 주문용 QR</strong>
              <p id="order-url">주소 확인 중…</p>
              <div class="inline-actions">
                <button id="copy-url-button" class="text-button" type="button">주소 복사</button>
                <a id="download-qr-link" class="text-button" download="drink-order-qr.png">QR 저장</a>
              </div>
            </div>
            <img id="qr-image" alt="2층 주문 페이지 QR 코드" />
          </aside>

          <section class="menu-manager" aria-labelledby="menu-manager-title">
            <div>
              <p class="eyebrow">판매 설정</p>
              <h2 id="menu-manager-title">메뉴 관리</h2>
            </div>
            <form id="menu-add-form" class="menu-add-form">
              <label>
                <span>아이콘</span>
                <input id="menu-icon" maxlength="12" value="🥤" required />
              </label>
              <label>
                <span>메뉴 이름</span>
                <input id="menu-name" maxlength="30" placeholder="예: 복숭아 아이스티" required />
              </label>
              <label>
                <span>분류</span>
                <select id="menu-category">
                  <option value="ADE">ADE</option>
                  <option value="NON SODA">NON SODA</option>
                </select>
              </label>
              <button class="secondary-button" type="submit">메뉴 추가</button>
            </form>
            <p id="menu-error" class="error-message" role="alert"></p>
            <div id="admin-menu-list" class="admin-menu-list"></div>
          </section>

          <div id="order-list" class="order-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <template id="menu-template">
      <article class="menu-card">
        <div>
          <span class="menu-icon" aria-hidden="true">🥤</span>
          <h2></h2>
          <span class="sold-out-label" hidden>품절</span>
        </div>
        <div class="quantity-control" aria-label="수량 선택">
          <button type="button" data-action="minus" aria-label="수량 줄이기">−</button>
          <output>0</output>
          <button type="button" data-action="plus" aria-label="수량 늘리기">＋</button>
        </div>
      </article>
    </template>

  </body>
</html>

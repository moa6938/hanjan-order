<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172238" />
    <title>인터넷 연결 확인 · 한 잔 주문</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fb; color: #172238; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border-radius: 20px; background: white; }
      h1 { font-size: 1.6rem; line-height: 1.4; }
      p { line-height: 1.7; color: #5d687b; }
      button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: #172238; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>한 잔 주문</p>
      <h1>인터넷 연결을 확인해 주세요.</h1>
      <p>주문 확인과 알림에는 인터넷이 필요해요. Wi-Fi 또는 데이터를 연결한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 연결</button>
    </main>
  </body>
</html>
